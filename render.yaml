services:
  # FastAPI RAG Backend
  - type: web
    name: production-rag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      # Groq retired llama-3.3-70b-versatile / llama-3.1-8b-instant on free and developer tiers (16 Aug 2026)
      - key: PRIMARY_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: QUERY_REWRITE_MODEL
        value: openai/gpt-oss-20b
      - key: ENABLE_LLM_FALLBACK
        value: "true"
      - key: FALLBACK_LLM_PROVIDER
        value: groq
      - key: FALLBACK_LLM_MODELS
        value: openai/gpt-oss-20b, gemini:gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: "3072"
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents
      - key: CORS_ORIGINS
        value: '["https://productionragagent.vercel.app"]'
      # Login: Render generates a random signing secret once and keeps it across deploys
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "true"
      # The administrator account. Set BOTH: it is created (or its password reset) at startup and is the only
      # admin. Registering this address through the sign-up form never grants admin rights.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Browser -> Vercel -> Cloudflare -> Render. cf-connecting-ip is the address Cloudflare saw connect (Vercel's
      # server: it cannot be forged), and Vercel forwards the visitor's own address, which identifies each user.
      # Verify under Settings -> Network check. Remove both if browsers call the API directly.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: FRONTEND_FORWARDS_CLIENT_IP
        value: "true"
      # Reverse proxies in front of the app; used to find the real client address for abuse limits
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Optional: lets the GitHub importer read private repos and raises GitHub's rate limit
      - key: GITHUB_TOKEN
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_FILES_PER_UPLOAD
        value: "10"
