services:
  # FastAPI RAG Backend
  - type: web
    name: production-rag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: PRIMARY_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_LLM_FALLBACK
        value: "true"
      - key: FALLBACK_LLM_PROVIDER
        value: groq
      - key: FALLBACK_LLM_MODELS
        value: llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: 3072
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents
      - key: CORS_ORIGINS
        value: '["*"]'
      # Login: Render generates a random signing secret once and keeps it across deploys
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "true"
      # Reverse proxies in front of the app; used to find the real client address for login rate limits
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Optional: lets the GitHub importer read private repos and raises GitHub's rate limit
      - key: GITHUB_TOKEN
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
      - key: MAX_FILES_PER_UPLOAD
        value: 10
