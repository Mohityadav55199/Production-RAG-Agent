name: Keep backend warm

# Render's free plan sleeps after ~15 minutes without traffic; the next visitor then waits ~50 s for a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://production-rag-agent.onrender.com/health
