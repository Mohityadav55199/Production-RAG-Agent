name: CI

# Runs on GitHub's own runners, so it does not touch the Render free-tier hours.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  backend-test:
    name: Backend tests, coverage and types
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ragtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # The database name must contain "test": the suite wipes the schema at the start
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:pw@localhost:5432/ragtest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Same LaTeX packages as the Docker image, so the resume PDF tests run for real instead of skipping
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Install dependencies (pinned, as in the Docker image)
        run: pip install -c requirements.lock -r requirements-dev.txt

      - name: Type check (mypy)
        run: mypy app

      - name: Tests with coverage
        run: pytest -q -ra --cov=app --cov-report=term --junitxml=test-results.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results.xml

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # report only; advisories without a fix should not block merges
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.lock --no-deps

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  api-types:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: pip install -c backend/requirements.lock -r backend/requirements.txt
      - run: npm ci
      - name: Regenerate lib/api-client/schema.d.ts from the backend
        run: npm run gen:api
      - name: Fail if the committed file differs
        run: |
          git diff --exit-code lib/api-client/schema.d.ts || {
            echo "::error::lib/api-client/schema.d.ts is out of date. Run 'npm run gen:api' (with the backend virtualenv active) and commit the result."
            exit 1
          }

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, backend-test, frontend, api-types]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
