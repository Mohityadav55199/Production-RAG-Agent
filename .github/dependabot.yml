version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      # One weekly PR for all minor/patch bumps; majors stay separate for review.
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # vitest and its plugins share an exact peer version and must move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      frontend-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vitest", "@vitest/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
