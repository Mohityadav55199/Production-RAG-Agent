# ─────────────────────────────────────────────────────────────────────────────
# Production RAG Agent — Full-Stack Docker Compose Orchestration
# ─────────────────────────────────────────────────────────────────────────────

networks:
  rag_network:
    name: rag_network
    driver: bridge

volumes:
  postgres_data:
    name: rag_postgres_data
  qdrant_data:
    name: rag_qdrant_data

services:

  # ── 1. PostgreSQL Relational Database ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── 2. Qdrant Vector Database ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - rag_network

  # ── 3. FastAPI Backend (LangGraph + RAG Pipeline) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: rag_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # In Docker, connect to services via their container service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    networks:
      - rag_network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 4. Next.js 15 Frontend UI ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - rag_network
    depends_on:
      backend:
        condition: service_started
