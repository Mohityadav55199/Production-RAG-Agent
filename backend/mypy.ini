; Type checking for the application code (run from backend/:  mypy app).
; The Pydantic plugin teaches mypy about Field(...) defaults. Tests, scripts, migrations and the eval harness are left out.

[mypy]
python_version = 3.12
plugins = pydantic.mypy
ignore_missing_imports = True
exclude = (alembic|scripts|eval|tests|loadtest|\.venv)/

[pydantic-mypy]
init_forbid_extra = False
init_typed = False
warn_required_dynamic_aliases = True

; The modules below call libraries whose type stubs are incomplete or too strict. Only the error kinds
; named here are switched off, per module, so everything else in them is still checked.

; Pillow's stubs type Image.open() as ImageFile and miss Image.LANCZOS; LangChain wants list[str | dict] content
[mypy-app.services.vision]
disable_error_code = assignment, attr-defined, arg-type

; the multimodal HumanMessage content list is wider than LangChain's declared type
[mypy-app.services.rag_graph]
disable_error_code = arg-type

; LangChain's with_fallbacks() return type does not match BaseChatModel
[mypy-app.services.llm_factory]
disable_error_code = return-value

; PyMuPDF's Document is iterable at runtime but not in its stubs
[mypy-app.services.resume.ats]
disable_error_code = attr-defined

; a tolerant wrapper object that forwards attributes dynamically
[mypy-app.api.resume]
disable_error_code = attr-defined
